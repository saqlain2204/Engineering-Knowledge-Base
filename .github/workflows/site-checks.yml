name: site-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shared layout (head tags, top bar, footer) is up to date
        run: python3 scripts/apply-layout.py --check

      - name: Architecture diagrams are valid and up to date
        run: python3 scripts/diagrams.py --check

      - name: Search index, sitemap, robots.txt and llms.txt are up to date
        run: |
          python3 scripts/build-search-index.py
          FILES="assets/search-index.json assets/search-index.js sitemap.xml robots.txt llms.txt"
          # <lastmod> comes from git history, which a shallow clone cannot see, so ignore it here.
          if [ -n "$(git status --porcelain -- $FILES | grep -v '^ M sitemap.xml$')" ] || ! git diff --quiet -I '<lastmod>' -- $FILES; then
            echo "::error::Generated site files are stale. Run: python3 scripts/build-search-index.py and commit the result."
            git status --short -- $FILES
            git diff --stat -I '<lastmod>' -- $FILES
            exit 1
          fi

      - name: Internal links and #anchors resolve
        run: python3 scripts/check-links.py

      - name: Reading-order links are up to date
        run: python3 scripts/update-prev-next.py --check

      - name: Page basics (title, description, viewport, one h1, unique ids)
        run: python3 scripts/check-pages.py
